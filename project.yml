name: MusicFox
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.jinoxide
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  MusicFox:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "MusicFox-Bridging-Header.h"
    settings:
      base:
        PRODUCT_NAME: MusicFox
        PRODUCT_BUNDLE_IDENTIFIER: com.jinoxide.musicfox
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/MusicFox-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/rust/target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-L$(SRCROOT)/rust/target/aarch64-apple-ios/release"
          - "-lmusicfox_core"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  MusicFox:
    build:
      targets:
        MusicFox: all
    run:
      config: Debug
    archive:
      config: Release
