name: Simulator Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Configure libclang
        run: |
          LIBCLANG="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIBCLANG/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
          else
            brew install llvm
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Build Rust for simulator
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            TARGET=aarch64-apple-ios-sim
          else
            TARGET=x86_64-apple-ios
          fi
          echo "SIM_TARGET=$TARGET" >> "$GITHUB_ENV"
          cd rust
          cargo build --release --target "$TARGET"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project MusicFox.xcodeproj \
            -scheme MusicFox \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build-sim \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            LIBRARY_SEARCH_PATHS="$PWD/rust/target/$SIM_TARGET/release" \
            OTHER_LDFLAGS='$(inherited) -lmusicfox_core -framework Security -framework CoreFoundation' \
            | tee xcodebuild-sim.log

      - name: Install and launch in simulator
        run: |
          set -euo pipefail
          APP="build-sim/Build/Products/Release-iphonesimulator/MusicFox.app"
          test -d "$APP"
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro (" | head -1 | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | head -1 | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/')
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.jinoxide.musicfox
          sleep 10
          xcrun simctl io "$UDID" screenshot simulator-home.png
          xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "MusicFox"' > simulator-app.log 2>&1 || true
          echo "Screenshot and log captured."
          tail -80 simulator-app.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: |
            simulator-home.png
            simulator-app.log
            xcodebuild-sim.log
          if-no-files-found: ignore
