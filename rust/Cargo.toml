[package]
name = "musicfox_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MusicFox native core: library scanning, NCM import, lyrics and music sources"

[lib]
name = "musicfox_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ecb = "0.1"
flate2 = "1"
lofty = "0.25"
md-5 = "0.10"
ncmdump = { version = "0.8", default-features = false, features = ["ncmdump"] }
percent-encoding = "2"
rsa = "0.9"
rand = "0.8"
rquickjs = { version = "0.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "3", features = ["json", "gzip"] }
urlencoding = "2"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
